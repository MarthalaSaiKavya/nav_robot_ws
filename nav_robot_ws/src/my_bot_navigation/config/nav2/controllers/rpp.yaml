# =============================================================================
#  CONTROLLER: Regulated Pure Pursuit (RPP)   (controller:=rpp)
# =============================================================================
#  Geometric path TRACKER: chase a "carrot" point lookahead_dist ahead on the path and
#  drive the arc through it (see my_bot_autonomy/learning/pure_pursuit.py). "Regulated" =
#  slows down in tight turns, near obstacles (high cost) and when approaching the goal.
#  Follows the path exactly; does NOT deviate around new obstacles by itself - it stops
#  (collision detection) and lets the planner re-plan. Simple, smooth, predictable.
#  Docs: https://docs.nav2.org/configuration/packages/configuring-regulated-pp.html
# =============================================================================
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.2
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
