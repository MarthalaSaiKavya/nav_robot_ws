# =============================================================================
#  ros2_control controller configuration  (only used with drive:=ros2_control)
# =============================================================================
#  The controller_manager runs INSIDE Gazebo (gz_ros2_control plugin) and loads
#  the controllers listed here. The launch file then "spawns" (activates) them:
#     ros2 run controller_manager spawner joint_state_broadcaster
#     ros2 run controller_manager spawner diff_drive_controller
#
#  Inspect at runtime:
#     ros2 control list_controllers
#     ros2 control list_hardware_interfaces
# =============================================================================
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz - how often controllers read sensors and write commands

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # MUST match urdf/inc/properties.xacro (wheel_separation, wheel_radius)
    wheel_separation: 0.35
    wheel_radius: 0.05

    # Odometry
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    # Our odometry_processor node owns the odom->base_footprint TF in every variant,
    # so the controller must NOT publish it too (two publishers of one TF = jumping robot).
    enable_odom_tf: false
    tf_frame_prefix_enable: false
    open_loop: false
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    # Safety: stop if no command arrives for 0.5 s
    cmd_vel_timeout: 0.5

    # Velocity / acceleration limits (same as the Gazebo DiffDrive variant)
    linear.x.max_velocity: 0.6
    linear.x.min_velocity: -0.6
    linear.x.max_acceleration: 1.5
    linear.x.min_acceleration: -1.5
    angular.z.max_velocity: 2.5
    angular.z.min_velocity: -2.5
    angular.z.max_acceleration: 4.0
    angular.z.min_acceleration: -4.0
