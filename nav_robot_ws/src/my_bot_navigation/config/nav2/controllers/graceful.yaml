# =============================================================================
#  CONTROLLER: Graceful Controller   (controller:=graceful)
# =============================================================================
#  A smooth CONTROL LAW (Park & Kuipers "graceful navigation"): computes a curvature
#  that steers the robot onto a target pose on the path with gentle, human-like arcs;
#  slows down near the goal. Fewer knobs than DWB/MPPI, very smooth motion.
#  Docs: https://docs.nav2.org/configuration/packages/configuring-graceful-motion-controller.html
# =============================================================================
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.1
      min_lookahead: 0.25
      max_lookahead: 1.0
      max_robot_pose_search_dist: 10.0
      k_phi: 2.0
      k_delta: 1.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.4
      v_angular_max: 1.5
      v_angular_min_in_place: 0.25
      slowdown_radius: 1.0
      initial_rotation: true
      initial_rotation_tolerance: 0.75
      prefer_final_rotation: true
      rotation_scaling_factor: 0.5
      allow_backward: false
      in_place_collision_resolution: 0.1
