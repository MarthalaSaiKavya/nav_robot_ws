# =============================================================================
#  PLANNER: Smac Planner 2D   (planner:=smac_2d)
# =============================================================================
#  Modern A* on the costmap grid (8-connected) with cost-aware search and a
#  built-in path smoother. Nav2's recommended replacement for NavFn for circular
#  differential/omni robots. Tunable "how much to avoid high cost cells".
#  Docs: https://docs.nav2.org/configuration/packages/smac/configuring-smac-2d.html
# =============================================================================
planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0   # >1 = prefer the centre of corridors (away from inflation)
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
