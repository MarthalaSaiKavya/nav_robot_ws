# =============================================================================
#  PLANNER: Smac Hybrid-A*   (planner:=smac_hybrid)
# =============================================================================
#  Searches over (x, y, HEADING) with car-like motion primitives (Dubins / Reeds-Shepp),
#  so paths respect a minimum turning radius and the full footprint. Designed for
#  Ackermann (car-like) and legged robots. On a diff-drive robot it works but makes
#  wide, car-like turns - instructive to compare with smac_2d!
#  Docs: https://docs.nav2.org/configuration/packages/smac/configuring-smac-hybrid.html
# =============================================================================
planner_server:
  ros__parameters:
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"   # DUBIN = forward only, REEDS_SHEPP = forward + reverse
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.25
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2
