# =============================================================================
#  CONTROLLER: Rotation Shim + RPP   (controller:=rotation_shim)
# =============================================================================
#  A "shim" WRAPS another controller: if the path starts behind/beside the robot it
#  first ROTATES IN PLACE to face the path, then hands over to the primary controller
#  (here RPP). Avoids the wide S-curves a tracker makes when starting misaligned.
#  Shows how Nav2 plugins can be COMPOSED.
#  Docs: https://docs.nav2.org/configuration/packages/configuring-rotation-shim-controller.html
# =============================================================================
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.3
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 3.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      # ---- parameters of the PRIMARY controller (RPP) live under the same name ----
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false    # the shim already does the rotating
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
